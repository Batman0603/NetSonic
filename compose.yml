
name: netsonic

services:
  backend:
    image: ghcr.io/batman0603/netsonic-backend:latest
    container_name: netsonic-backend
    restart: unless-stopped
    cap_add:
      - NET_RAW
    environment:
      DATABASE_URL: "sqlite:////data/netsonic.db"
      APP_ENV: "production"
      LOG_LEVEL: "INFO"
    expose:
      - "8000"
    volumes:
      - netsonic-data:/data
    networks:
      - netsonic-network

  frontend:
    image: ghcr.io/batman0603/netsonic-frontend:latest
    container_name: netsonic-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - netsonic-network

networks:
  netsonic-network:
    driver: bridge

volumes:
  netsonic-data:
